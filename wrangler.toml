name = "sandpro"
main = "cloudflare-worker/worker.js"
compatibility_date = "2026-08-13"

# الواجهة الأمامية (React) تُبنى بـ: npm run build (vite build)
# ثم تُنشر كـ Static Assets من مجلد dist
[assets]
directory = "./dist"
binding = "ASSETS"

# النشر:
#   npm run build
#   npx wrangler deploy
# ملاحظة: مفتاح GEMINI_API_KEY مضاف كـ Secret عبر:
#   npx wrangler secret put GEMINI_API_KEY
